; Пул PHP-FPM ЯМузыканта (задача 0.1.4): процессы от пользователя деплоя, сокет — для Nginx.
[ymuzykant]
user = __USER__
group = __USER__
listen = /run/php/ymuzykant.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
catch_workers_output = yes
php_admin_value[error_log] = __APP_ROOT__/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
