# deploy/provision.sh sshd (задача 0.1.12): вход на сервер только по SSH-ключу.
# Имя 00-… — первым в /etc/ssh/sshd_config.d: sshd берёт первое значение параметра, поэтому
# 50-cloud-init.conf (PasswordAuthentication yes) его не перекрывает. Итог сверяется через sshd -T.
# root входит только по ключу: provision.yml подключается от root (PROVISION_USER).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
PermitEmptyPasswords no
