# Сайт ЯМузыканта (задача 0.1.4). Ставит deploy/provision.sh в /etc/nginx/sites-available/ymuzykant;
# __DOMAIN__ и __APP_ROOT__ подставляет provision.sh. Перед сервером нет прокси и CDN (решение OWNER
# 03.11.2026), поэтому PHP-FPM получает адрес клиента в REMOTE_ADDR, а X-Forwarded-For не доверяется.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ymuzykant_ssl:10m;
    ssl_session_timeout 1d;

    root __APP_ROOT__/current/public;
    index index.php;
    charset utf-8;
    # Фото до 15 МБ (ARCHITECTURE §7) с запасом на multipart.
    client_max_body_size 20m;

    include /etc/nginx/ymuzykant/security-headers.conf;

    # stage закрыт паролем целиком, кроме проверок живости.
    auth_basic "YaMuzykant stage";
    auth_basic_user_file /etc/nginx/ymuzykant/stage.htpasswd;

    location = /health {
        auth_basic off;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        auth_basic off;
        try_files $uri /index.php?$query_string;
    }

    # Сборка Vite: имена файлов с хешем содержимого — кэш на год, immutable.
    location /build/ {
        include /etc/nginx/ymuzykant/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Шрифты без хеша в имени (ревью PR #84): кэш на год, но без immutable.
    location /fonts/ {
        include /etc/nginx/ymuzykant/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    # Reverb (WebSocket); сервер слушает только 127.0.0.1:8080.
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8080;
    }

    # Mailpit (письма stage) — свой пароль, отдельный от пароля stage.
    location /_mailpit/ {
        auth_basic "Mailpit";
        auth_basic_user_file /etc/nginx/ymuzykant/mailpit.htpasswd;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:8025;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Только фронт-контроллер; $realpath_root — путь релиза, на который указывает current.
    location = /index.php {
        fastcgi_pass unix:/run/php/ymuzykant.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
