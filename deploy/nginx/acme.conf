# Временный сайт до выпуска сертификата (deploy/provision.sh): только проверка certbot по HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
