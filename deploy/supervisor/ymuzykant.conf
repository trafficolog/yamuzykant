; Фоновые процессы ЯМузыканта (задача 0.1.4). Ставит deploy/provision.sh в /etc/supervisor/conf.d/.
; __APP_ROOT__ и __USER__ подставляет provision.sh. Команды — deploy/bin/worker.sh из current:
; после переключения симлинка deploy.sh перезапускает процессы, и они берут код нового релиза.
[group:ymuzykant]
programs=ymuzykant-queue,ymuzykant-reverb,ymuzykant-ssr,ymuzykant-scheduler

[program:ymuzykant-queue]
; Horizon (или queue:work) по очередям high,default; horizon:terminate даёт доработать задачи
command=/bin/bash __APP_ROOT__/current/deploy/bin/worker.sh queue
user=__USER__
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=__APP_ROOT__/shared/storage/logs/queue.log

[program:ymuzykant-reverb]
command=/bin/bash __APP_ROOT__/current/deploy/bin/worker.sh reverb
user=__USER__
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__APP_ROOT__/shared/storage/logs/reverb.log

[program:ymuzykant-ssr]
command=/bin/bash __APP_ROOT__/current/deploy/bin/worker.sh ssr
user=__USER__
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__APP_ROOT__/shared/storage/logs/ssr.log

[program:ymuzykant-scheduler]
command=/bin/bash __APP_ROOT__/current/deploy/bin/worker.sh scheduler
user=__USER__
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__APP_ROOT__/shared/storage/logs/scheduler.log
