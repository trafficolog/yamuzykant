name: Deploy stage
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
concurrency: deploy-stage

# Выкатке нужно только чтение кода; прав на запись у workflow нет (0.1.10).
permissions:
  contents: read

jobs:
  deploy:
    # Без защиты веток и правил окружений (бесплатный тариф, риск R2 аудита G0) выкатка stage
    # идёт только от зелёного CI на push в main этого репозитория: PR из форка с веткой main,
    # PR из ветки этого репозитория и push в другие ветки пропускаются.
    # Условия проверяет .github/scripts/workflow-guards.test.mjs в job docs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Ожидание блокировки сервера (DEPLOY_LOCK_WAIT, 15 мин) + сборка и проверки (до 20 мин), 0.1.12.
    timeout-minutes: 35
    environment: stage
    steps:
      # Выкатывается только head_sha проверенного запуска CI: он же в checkout и в env.SHA,
      # deploy.sh сверяет его с HEAD (0.1.4, N9).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      # Пока переменная окружения stage STAGE_DEPLOY_LIVE ≠ true, выкатка идёт в режиме dry-run:
      # архив и .env собираются, на сервер ничего не уходит. OWNER ставит true после provision.yml
      # (provision) — порядок в docs/02-process/CI-CD.md §5. SSH — только по ключу DEPLOY_SSH_KEY,
      # ключ сервера — из секрета DEPLOY_KNOWN_HOSTS (StrictHostKeyChecking yes, deploy/lib.sh).
      - name: Ключ деплоя — приватный ключ OpenSSH (без печати значения)
        if: vars.STAGE_DEPLOY_LIVE == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          case "$KEY" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"*) echo "формат ключа верный" ;;
            *) echo "::error::DEPLOY_SSH_KEY — не приватный ключ OpenSSH: вставьте файл ключа целиком, от -----BEGIN OPENSSH PRIVATE KEY----- до END (не пароль и не .pub), задача 0.1.12"; exit 1 ;;
          esac
      - if: vars.STAGE_DEPLOY_LIVE == 'true'
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Выкатка на stage (deploy/deploy.sh)
        run: ./deploy/deploy.sh stage "$SHA"
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_LOCK_WAIT: '900'
          DEPLOY_DRY_RUN: ${{ vars.STAGE_DEPLOY_LIVE == 'true' && '0' || '1' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_URL: ${{ vars.STAGE_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MEILISEARCH_KEY: ${{ secrets.MEILISEARCH_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REVERB_APP_ID: ${{ secrets.REVERB_APP_ID }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: stage отвечает на /health
        if: vars.STAGE_DEPLOY_LIVE == 'true'
        env:
          STAGE_URL: ${{ vars.STAGE_URL }}
        run: curl -fsS --retry 10 --retry-delay 6 "$STAGE_URL/health"
