name: Deploy stage
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
concurrency: deploy-stage

# Выкатке нужно только чтение кода; прав на запись у workflow нет (0.1.10).
permissions:
  contents: read

jobs:
  deploy:
    # Без защиты веток и правил окружений (бесплатный тариф, риск R2 аудита G0) выкатка stage
    # идёт только от зелёного CI на push в main этого репозитория: PR из форка с веткой main,
    # PR из ветки этого репозитория и push в другие ветки пропускаются.
    # Условия проверяет .github/scripts/workflow-guards.test.mjs в job docs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Пропуск, пока нет deploy/deploy.sh (до задачи 0.1.4)
        id: has
        run: echo "ok=$([ -f deploy/deploy.sh ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - if: steps.has.outputs.ok == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - if: steps.has.outputs.ok == 'true'
        run: ./deploy/deploy.sh stage ${{ github.event.workflow_run.head_sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      - if: steps.has.outputs.ok == 'true'
        run: curl -fsS --retry 10 --retry-delay 6 "${{ vars.STAGE_URL }}/health"
