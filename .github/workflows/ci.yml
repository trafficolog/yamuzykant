name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# На PR новый пуш отменяет устаревший запуск; на main каждый коммит проверяется до конца (от него зависит deploy.yml).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: pdo_pgsql, pdo_sqlite, redis, intl, gd
  # Node 22 LTS: jsdom 30 и undici из lock-файла требуют Node ≥ 22.22 (на Node 20 Vitest падает).
  NODE_VERSION: '22'

# Имена jobs docs, php, js, e2e — обязательные проверки main (CI-CD.md §4, ORCHESTRATOR §0 п.4).
# Экономия минут (0.1.17): job changes определяет, менялся ли код (всё вне docs/** и *.md в корне);
# php, js, e2e без кода пропускаются; e2e идёт на push в main и по workflow_dispatch (перед мержем), на PR — нет.
# Пропущенный job не роняет прогон; SKIPPED допустим только при changes = SUCCESS и code=false (CI-CD.md §2).
# Внутри job проверки идут шагами с `if: !cancelled() && steps.install.outcome == 'success'`:
# одна упавшая проверка не скрывает остальные, а job всё равно красный.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # PR: на merge-ref первый родитель — актуальная база, хватает глубины 2. Push: нужен event.before.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Нет базы (dispatch, новая ветка, force-push, нулевой before) — считаем, что код изменился.
          case "$EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE_SHA" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null \
            || ! git diff --name-only "$base" HEAD > changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          cat changed.txt
          other="$(grep -E . changed.txt | grep -cvE '^(docs/.*|[^/]+\.md)$' || true)"
          if [ "$other" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Тесты скриптов CI
        run: node --test .github/scripts/coverage-gate.test.mjs .github/scripts/workflow-guards.test.mjs .github/scripts/workflow-pins.test.mjs .github/scripts/deploy-scripts.test.mjs
      - name: Тесты lint-copy и словаря copy.spec
        run: node --test tools/lint-copy.test.mjs tools/copy-dictionary.test.mjs
      - name: Карточки, зависимости, гейты (docs-ops check)
        if: ${{ !cancelled() }}
        run: node tools/docs-ops.mjs check
      - name: Запрещённые слова и цвета без токенов (lint-copy --styles)
        if: ${{ !cancelled() }}
        run: node tools/lint-copy.mjs --styles
      - name: resources/js/ds совпадает с результатом npm run ds:sync
        if: ${{ !cancelled() }}
        run: |
          node tools/ds-sync.mjs
          changes="$(git status --porcelain --untracked-files=all -- resources/js/ds)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::resources/js/ds правится только командой npm run ds:sync (AGENTS.md §4)"; exit 1; fi

  php:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pgsql:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.15
        env:
          MEILI_MASTER_KEY: testing
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
    # Только тестовые значения; реальные секреты CI не нужны (CI-CD.md §5).
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: app
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      MEILISEARCH_HOST: http://127.0.0.1:7700
      MEILISEARCH_KEY: testing
      MAIL_MAILER: array
      LOGIN_CODE_FAKE: '123456'
      YANDEX_OAUTH_FAKE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - id: install
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
      - name: Pint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/pint --test
      - name: Larastan (уровень 8)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github
      - name: Pest + покрытие (общее ≥ 75 %)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          vendor/bin/pest --coverage --min=75
          --coverage-clover coverage/php/clover.xml
          --coverage-html coverage/php/html
      - name: Покрытие app/Domain ≥ 90 %
        if: ${{ !cancelled() && hashFiles('coverage/php/clover.xml') != '' }}
        run: node .github/scripts/coverage-gate.mjs coverage/php/clover.xml --path app/Domain --min 90
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-php
          path: coverage/php
          if-no-files-found: ignore
          retention-days: 14

  js:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: install
        run: npm ci --no-audit --no-fund
      - name: ESLint + Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: tsc --noEmit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Vitest + покрытие
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          npm run test:js -- --coverage
          --coverage.reportsDirectory=coverage/js
          --coverage.include='resources/js/**'
          --coverage.exclude='resources/js/ds/**'
      - id: build
        name: Сборка клиента и SSR
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build && npm run build:ssr
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-js
          path: coverage/js
          if-no-files-found: ignore
          retention-days: 14
      # Сборка переиспользуется в e2e, чтобы не собирать второй раз.
      - if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: |
            public/build
            bootstrap/ssr
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: [changes, php, js]
    if: ${{ needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pgsql:
        image: postgres:16
        env:
          POSTGRES_DB: e2e
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.15
        env:
          MEILI_MASTER_KEY: testing
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
    env:
      APP_ENV: e2e
      DS_SHOWCASE: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: e2e
      DB_USERNAME: app
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      MEILISEARCH_HOST: http://127.0.0.1:7700
      MEILISEARCH_KEY: testing
      MAIL_MAILER: array
      LOGIN_CODE_FAKE: '123456'
      YANDEX_OAUTH_FAKE: 'true'
      QUEUE_CONNECTION: redis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
      - name: Окружение, миграции и сиды
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: ${{ steps.pw-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ steps.pw-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium
      # php artisan serve и SSR поднимает сам Playwright (webServer в playwright.config.ts).
      - name: Очередь и Reverb в фоне
        run: |
          php artisan queue:work --sleep=1 --tries=1 > storage/logs/queue.log 2>&1 &
          if php artisan list --raw | grep -q '^reverb:start'; then
            php artisan reverb:start > storage/logs/reverb.log 2>&1 &
          else
            echo "::notice::Reverb ещё не установлен — сервер WebSocket не запускается"
          fi
      - name: Playwright (UC, visual, a11y, copy)
        run: npx playwright test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            storage/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diff
          path: |
            test-results/**/*-diff.png
            test-results/**/*-actual.png
            test-results/**/*-expected.png
          if-no-files-found: ignore
          retention-days: 14
