<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/webfonts.css">
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/tokens.css">
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/page.css">
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/components.css">
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/forms.css">
  <link rel="stylesheet" href="ym-compat.css">
  <script src="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/_ds_bundle.js"></script>
  <script src="plain-language.js"></script>
</helmet>
<div ref="{{ root }}">
  <x-import component-from-global-scope="DesignSystem_b66810.Footer" social="{{ social }}" hint-size="100%,420px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:420}}">
const LINKS = {
  'Каталог': 'Десктоп - Каталог.dc.html',
  'Барахолка': 'Десктоп - Каталог.dc.html?view=flea',
  'Аксессуары': 'Десктоп - Аксессуары.dc.html',
  'Мастера': 'Десктоп - Мастера.dc.html',
  'Цены на б/у': 'Десктоп - Цены продаж.dc.html',
  'Безопасная сделка': 'Десктоп - Помощь.dc.html',
  'Доставка с упаковкой': 'Десктоп - Помощь.dc.html',
  'Продать инструмент': 'Десктоп - Продать.dc.html',
  'Магазинам-партнёрам': 'Десктоп - Тарифы.dc.html',
  'Кабинет мастерской': 'Десктоп - Кабинет.dc.html',
  'Как выбрать б/у инструмент': 'Десктоп - Помощь.dc.html',
  'Правила размещения': 'Десктоп - Помощь.dc.html',
  'Как работает безопасная сделка': 'Десктоп - Помощь.dc.html',
  'Как не попасть на мошенников': 'Десктоп - Помощь.dc.html',
  'Споры и возвраты': 'Десктоп - Помощь.dc.html',
  'Написать в поддержку': 'Десктоп - Сообщения.dc.html?chat=support'
};
class Component extends DCLogic {
  root = React.createRef();
  componentDidMount() { this.link(); this.mo = new MutationObserver(() => this.link()); if (this.root.current) this.mo.observe(this.root.current, { childList: true, subtree: true }); }
  componentWillUnmount() { this.mo && this.mo.disconnect(); }
  link() {
    const el = this.root.current; if (!el) return;
    el.querySelectorAll('a[href="#"]').forEach(a => {
      const href = LINKS[a.textContent.trim()];
      if (href) a.setAttribute('href', href);
      else if (a.classList.contains('ym-wordmark')) a.setAttribute('href', 'Десктоп - Главная.dc.html');
    });
  }
  renderVals() {
    return { root: this.root, social: ['Telegram', 'ВКонтакте', 'MAX'] };
  }
}
</script>
</body>
</html>
