<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/webfonts.css">
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/tokens.css">
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/page.css">
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/components.css">
  <link rel="stylesheet" href="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/tokens/forms.css">
  <link rel="stylesheet" href="ym-compat.css">
  <script src="_ds/design-system-b66810d8-d429-49ea-bb35-5b22a7aa4f3a/_ds_bundle.js"></script>
  <script src="plain-language.js"></script>
  <style>
    /* Hallmark · page: staff console — audit log · theme: ЯМузыкант DS tokens · pre-emit critique: P4 H4 E4 S4 R5 V4 */
    html, body { margin: 0; background: var(--surface); color: var(--ink); overflow-x: clip; }
    a { color: var(--lad); text-decoration: none; }
    a:not([class*="lm-"]):hover { color: var(--lad-strong); text-decoration: underline; }
  </style>
</helmet>
<div class="lm-root" data-screen-label="Админ — Журнал действий" style="min-height: 100vh; background: var(--surface); font-family: var(--font-text);">
  <dc-import name="Админ - Шапка" role="admin" hint-size="100%,64px"></dc-import>
  <div style="display: grid; grid-template-columns: minmax(200px, 240px) minmax(0, 1fr); min-height: calc(100vh - 65px);">
    <dc-import name="Админ - Меню" active="log" role="admin" hint-size="100%,100%"></dc-import>

    <main style="display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-6) var(--space-8) var(--space-12); min-width: 0;">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column; gap: var(--space-1);">
          <h1 class="h1 lm-title" style="margin: 0;">Журнал действий</h1>
          <span class="body-s" style="color: var(--ink-muted);">Все действия сотрудников. Записи нельзя изменить или удалить.</span>
        </div>
        <x-import component-from-global-scope="DesignSystem_b66810.Button" variant="outline" size="s" hint-size="160px,40px">Выгрузить в CSV</x-import>
      </div>

      <div style="display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: flex-end;">
        <div style="flex: 1 1 260px;"><x-import component-from-global-scope="DesignSystem_b66810.Field" id="lq" label="Поиск" placeholder="Номер объявления, обращения или имя" value="{{ q }}" onChange="{{ onQ }}" hint-size="100%,72px"></x-import></div>
        <label style="display: flex; flex-direction: column; gap: var(--space-2); flex: 0 1 220px;"><span class="label" style="font-weight: 600;">Сотрудник</span>
          <select value="{{ who }}" onChange="{{ onWho }}" style="min-height: 48px; padding: 0 var(--space-3); border: 1px solid var(--line-control); border-radius: var(--radius-sm); background: var(--surface-raised); color: var(--ink); font: 400 var(--text-m)/1 var(--font-text);">
            <sc-for list="{{ people }}" as="p" hint-placeholder-count="5"><option value="{{ p.v }}">{{ p.label }}</option></sc-for>
          </select>
        </label>
      </div>
      <div role="radiogroup" aria-label="Тип действия" style="display: flex; flex-wrap: wrap; gap: var(--space-2);">
        <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="6">
          <x-import component-from-global-scope="DesignSystem_b66810.FilterChip" radio="{{ true }}" selected="{{ k.on }}" count="{{ k.count }}" onChange="{{ k.pick }}" hint-size="120px,40px">{{ k.label }}</x-import>
        </sc-for>
      </div>

      <div role="table" aria-label="Журнал" style="display: flex; flex-direction: column; border-top: 1px solid var(--line);">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
          <div role="row" style="display: grid; grid-template-columns: 80px minmax(120px, 170px) minmax(0, 1fr); gap: var(--space-4); align-items: start; padding: var(--space-3) 0; border-bottom: 1px solid var(--line);">
            <span role="cell" style="display: flex; flex-direction: column;">
              <span class="body-s" style="font-family: var(--font-mono); font-variant-numeric: tabular-nums;">{{ r.time }}</span>
              <span class="caption" style="color: var(--ink-muted);">{{ r.day }}</span>
            </span>
            <span role="cell" style="display: flex; flex-direction: column; min-width: 0;">
              <span class="body-s" style="font-weight: 600;">{{ r.who }}</span>
              <span class="caption" style="color: var(--ink-muted);">{{ r.role }}</span>
            </span>
            <span role="cell" style="display: flex; flex-direction: column; gap: var(--space-1); min-width: 0;">
              <span style="display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;">
                <span style="flex: none; display: flex;"><x-import component-from-global-scope="DesignSystem_b66810.Badge" tone="{{ r.tone }}" hint-size="100px,24px">{{ r.kind }}</x-import></span>
                <span class="body-s">{{ r.what }}</span>
              </span>
              <sc-if value="{{ r.hasWhy }}" hint-placeholder-val="{{ false }}">
                <span class="caption" style="color: var(--ink-muted); text-wrap: pretty;">Причина: {{ r.why }}</span>
              </sc-if>
            </span>
          </div>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <p class="body-s" style="margin: 0; padding: var(--space-6) 0; color: var(--ink-muted);">Записей не найдено.</p>
        </sc-if>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const KIND = { mod: ['Модерация', 'nickel'], block: ['Ограничение', 'danger'], ticket: ['Обращение', 'neutral'], partner: ['Партнёры', 'lad'], money: ['Деньги', 'warning'], access: ['Доступ', 'copper'] };
const ROLE = { 'Ольга Т.': 'администратор', 'Марина К.': 'модератор', 'Игорь П.': 'поддержка', 'Денис Р.': 'партнёры' };
const LOG = [
  ['14:12', 'сегодня', 'Марина К.', 'mod', 'Отклонила ОБ-26-18187 и отправила продавца на проверку', 'фото с другого сайта, 2 жалобы'],
  ['14:05', 'сегодня', 'Игорь П.', 'ticket', 'Закрыл обращение № 4119 «Не пришёл код входа»', ''],
  ['13:58', 'сегодня', 'Денис Р.', 'partner', 'Подтвердил компанию ООО «Гитарный угол», тариф «Бизнес»', ''],
  ['13:41', 'сегодня', 'Марина К.', 'mod', 'Вернула ОБ-26-18176 на доработку', 'нет фото серийного номера'],
  ['13:20', 'сегодня', 'Ольга Т.', 'access', 'Выдала права «Поддержка» сотруднику Анна С.', ''],
  ['12:47', 'сегодня', 'Игорь П.', 'block', 'Предупредил пользователя Виктор Л. (ID 1039876)', 'грубость в переписке'],
  ['11:30', 'сегодня', 'Ольга Т.', 'money', 'Начислила 299 баллов ООО «Гитарный угол»', 'компенсация за сбой показа на главной'],
  ['18:10', 'вчера', 'Денис Р.', 'money', 'Изменил цену тарифа «Про»: 7 490 → 7 990 ₽', 'с 1 ноября'],
  ['16:02', 'вчера', 'Ольга Т.', 'block', 'Заблокировала Мария Ш. (ID 1050402) бессрочно', 'мошенничество, 4 жалобы'],
  ['15:15', 'вчера', 'Марина К.', 'mod', 'Опубликовала ОБ-26-18120', '']
];
class Component extends DCLogic {
  state = { q: '', who: 'all', kind: 'all' };
  renderVals() {
    const s = this.state;
    const q = s.q.trim().toLowerCase();
    const base = LOG.filter(r => (s.who === 'all' || r[2] === s.who) && (!q || (r[4] + ' ' + r[5] + ' ' + r[2]).toLowerCase().includes(q)));
    const rows = base.filter(r => s.kind === 'all' || r[3] === s.kind);
    return {
      q: s.q, onQ: e => this.setState({ q: e.target.value }),
      who: s.who, onWho: e => this.setState({ who: e.target.value }),
      people: [{ v: 'all', label: 'Все сотрудники' }].concat(Object.keys(ROLE).map(n => ({ v: n, label: n }))),
      kinds: [['all', 'Все']].concat(Object.entries(KIND).map(([k, v]) => [k, v[0]])).map(([k, label]) => ({ label, on: s.kind === k, count: k === 'all' ? base.length : base.filter(r => r[3] === k).length, pick: () => this.setState({ kind: k }) })),
      rows: rows.map(([time, day, who, k, what, why]) => ({ time, day, who, role: ROLE[who], kind: KIND[k][0], tone: KIND[k][1], what, why, hasWhy: !!why })),
      empty: rows.length === 0
    };
  }
}
</script>
</body>
</html>
